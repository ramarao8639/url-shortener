apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: default
spec:
  replicas: 1

  selector:
    matchLabels:
      app: url-shortener

  template:
    metadata:
      labels:
        app: url-shortener

    spec:
      containers:
        - name: url-shortener

          image: 809554585891.dkr.ecr.ap-south-1.amazonaws.com/url-shortener:997b26e79b4aa0a0447247c9b27eaba42c0dd08d

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/url_shortener

            - name: SPRING_DATASOURCE_USERNAME
              value: postgres

            - name: SPRING_DATASOURCE_PASSWORD
              value: root

            - name: SPRING_DATA_REDIS_HOST
              value: redis

            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            - name: APP_BASE_URL
              value: http://a241e6eacdf6d4edba51d6f243097e7f-1504230815.ap-south-1.elb.amazonaws.com