      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------
      # 2. Setup Java
      # ---------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ---------------------------------
      # 3. Build Spring Boot Application
      # ---------------------------------
      - name: Build Application
        run: mvn clean install -DskipTests

      # ---------------------------------
      # 4. Configure AWS Credentials
      # ---------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809554585891:role/GitHubActions-EKS-DeployRole
          aws-region: ap-south-1

      # ---------------------------------
      # 5. Login to Amazon ECR
      # ---------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------
      # 6. Build Docker Image
      # ---------------------------------
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          IMAGE_TAG=${{ github.sha }}

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            .

      # ---------------------------------
      # 7. Push Docker Image to ECR
      # ---------------------------------
      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          IMAGE_TAG=${{ github.sha }}

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      # ---------------------------------
      # 8. Update Kubernetes Manifest
      # ---------------------------------
      - name: Update Deployment Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

          sed -i "s|image: .*url-shortener.*|image: $IMAGE|g" \
            k8s/app/deployment.yaml

          echo "Updated image:"
          grep "image:" k8s/app/deployment.yaml

      # ---------------------------------
      # 9. Commit Updated Manifest
      # ---------------------------------
      - name: Commit and Push Image Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/app/deployment.yaml

          git commit -m "Update Kubernetes image to ${{ github.sha }} [skip ci]" || echo "No changes to commit"

          git push origin main
