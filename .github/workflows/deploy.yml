name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: url-shortener

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      # 2. Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # 3. Build Spring Boot application
      - name: Build Application
        run: |
          mvn clean install -DskipTests


      # 4. Configure AWS Credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809554585891:role/GitHubActions-EKS-DeployRole
          aws-region: ${{ env.AWS_REGION }}


      # 5. Verify AWS Identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity


      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # 7. Build Docker Image
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          IMAGE_TAG=${{ github.sha }}

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            .


      # 8. Push Docker Image to ECR
      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          IMAGE_TAG=${{ github.sha }}

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG


      # 9. Update Image in Kubernetes Manifest
      - name: Update Kubernetes Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

          echo "Updating image to: $IMAGE"

          sed -i "s|image: .*|image: $IMAGE|g" k8s/app/deployment.yaml

          echo "Updated deployment.yaml:"
          cat k8s/app/deployment.yaml


      # 10. Commit Updated Kubernetes Manifest
      - name: Commit and Push Kubernetes Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/app/deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Kubernetes image to ${{ github.sha }}"
            git push origin main
          fi
